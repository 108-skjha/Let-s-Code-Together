<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="bg" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1d1f23"/>
      <rect width="10" height="10" fill="#111" opacity="0.25"/>
      <rect x="10" y="10" width="10" height="10" fill="#111" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="8"/>

  <!-- Collaboration Icon -->
  <g transform="translate(55,95)" fill="none" stroke="#32FF7E" stroke-width="9" stroke-linecap="round">
    <line x1="0" y1="0" x2="-60" y2="-60"/>
    <line x1="0" y1="0" x2="60" y2="-60"/>
    <line x1="0" y1="0" x2="-75" y2="25"/>
    <line x1="0" y1="0" x2="55" y2="70"/>
    <line x1="0" y1="0" x2="-5" y2="85"/>
    <g stroke="none" fill="#32FF7E">
      <circle cx="0" cy="-18" r="20"/>
      <rect x="-32" y="0" width="64" height="45" rx="22"/>
      <circle cx="-80" cy="-80" r="16"/>
      <circle cx="80" cy="-80" r="16"/>
      <circle cx="-95" cy="35" r="16"/>
      <circle cx="70" cy="90" r="16"/>
      <circle cx="-5" cy="108" r="16"/>
    </g>
  </g>

  <!-- Text -->
  <g font-family="Poppins, Arial, sans-serif" font-weight="500">
    <text x="155" y="95" font-size="60" fill="#FFFFFF">
      Let’s Code 
      <tspan fill="#32FF7E">Together</tspan>
    </text>
    <text x="155" y="145" font-size="26" fill="#FFFFFF" font-weight="300">
      Where Coding &amp; Collaboration Meet
    </text>
  </g>
</svg>
